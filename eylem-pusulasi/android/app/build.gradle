plugins { id 'com.android.application' }

android {
    namespace 'com.eylempusulasi.app'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.eylempusulasi.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (System.getenv('EYLEM_KEYSTORE')) {
                storeFile file(System.getenv('EYLEM_KEYSTORE'))
                storePassword System.getenv('EYLEM_KEY_PASSWORD')
                keyAlias 'eylem'
                keyPassword System.getenv('EYLEM_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
