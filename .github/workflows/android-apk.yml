name: Eylem Pusulasi APK
on:
  push:
    branches: [eylem-pusulasi-android]
    paths: ["eylem-pusulasi/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eylem-android
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: eylem-pusulasi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          package_json_file: eylem-pusulasi/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.1.0
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Test domain and build local app assets
        run: |
          node node_modules/vitest/vitest.mjs run
          node scripts/build-android.mjs
      - name: Prepare signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/signing-key.sh
      - name: Preserve signing key for updates
        uses: actions/upload-artifact@v4
        with:
          name: eylem-signing-key
          path: |
            ${{ runner.temp }}/eylem-signing/release.jks
            ${{ runner.temp }}/eylem-signing/password.txt
          retention-days: 90
          if-no-files-found: error
      - name: Build signed APK and test APK
        run: gradle -p android assembleRelease assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: eylem-pusulasi-apk
          path: eylem-pusulasi/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          if-no-files-found: error
      - name: Enable emulator acceleration
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify offline Android lifecycle and backup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: gradle -p eylem-pusulasi/android connectedDebugAndroidTest --no-daemon
      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eylem-android-test-results
          path: |
            eylem-pusulasi/android/app/build/reports/androidTests/
            eylem-pusulasi/android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
